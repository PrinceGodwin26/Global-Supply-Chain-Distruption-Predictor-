version: '3.8'

services:
  # ── PostgreSQL database ───────────────────────────────────────
  db:
    image: postgres:16
    container_name: supply_chain_db
    environment:
      POSTGRES_DB: supply_chain_db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Mount init script — runs automatically on first container start
      # Creates all tables so no manual psql setup is needed
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      # Health check ensures other services wait until Postgres is
      # actually ready to accept connections, not just started
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d supply_chain_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Data collection scheduler ─────────────────────────────────
  scheduler:
    build: .
    container_name: supply_chain_scheduler
    # Override the default CMD from Dockerfile to run the scheduler
    command: python3 -m src.ingestion.scheduler
    env_file:
      - .env
    volumes:
      - .:/app
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # unless-stopped means: restart automatically if it crashes,
    # but don't restart if we manually stop it with docker-compose down

  # ── FastAPI REST API ──────────────────────────────────────────
  api:
    build: .
    container_name: supply_chain_api
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Streamlit dashboard ───────────────────────────────────────
  dashboard:
    build: .
    container_name: supply_chain_dashboard
    command: streamlit run src/dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    env_file:
      - .env
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
